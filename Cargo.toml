[package]
name = "sonic-bridge-mcp"
version = "0.1.2"
edition = "2021"
description = "Model Context Protocol (MCP) server for SonicBridge, providing AI agents with physical music aesthetic capabilities."

[dependencies]
sonic-bridge = { git = "https://github.com/Xuepoo/sonic-bridge", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
